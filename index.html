/* Layout: phone menu card. Centered logo and script line, centered section titles between hairlines, name and description left with prices in a right column, a photo slot beside the first dishes of food sections (alternating sides). Wide screens: two columns of sections. */
:root{
  --paper:#F3EEE6;
  --ink:#24211E;
  --soft:#5A544D;
  --hair:#B9B0A4;
  --red:#D7262E;
  --slot:#E7DFD3;
  --flag:#FFF3C4;
  --sans:"KSans","Montserrat","Avenir Next",system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK SC",sans-serif;
  --script:"KScript","Great Vibes","Snell Roundhand",cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px;position:relative}

/* masthead */
.mast{position:relative;text-align:center;padding:30px 0 6px}
.mast img{width:min(230px,62vw);height:auto;display:block;margin:0 auto}
.tag{font-family:var(--script);font-size:27px;color:#8A6E4B;margin:8px 0 2px;line-height:1.2}
:lang(zh) .tag,:lang(ja) .tag{font-family:var(--sans);font-size:15px;letter-spacing:.2em;color:var(--soft)}
.branch{position:absolute;top:0;right:-18px;width:150px;height:150px;pointer-events:none}
.branch.l{right:auto;left:-26px;top:auto;bottom:-50px;width:110px;height:110px;transform:scaleX(-1) rotate(160deg);opacity:.75}

/* sticky bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--hair)}
.barin{display:flex;align-items:center;gap:12px}
nav.chips{flex:1;display:flex;gap:20px;overflow-x:auto;padding:11px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;padding:2px 0;font:inherit;font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);cursor:pointer;border-bottom:1.5px solid transparent}
.chip[aria-current="true"]{color:var(--ink);border-bottom-color:var(--red)}
.langbtn{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-weight:500;font-size:12px;letter-spacing:.08em;padding:6px 11px;cursor:pointer;min-height:34px}
.langbtn svg{width:15px;height:15px}
.chip:focus-visible,.langbtn:focus-visible,.opt:focus-visible,.revbtn:focus-visible,.note-top a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.note-top{font-size:12.5px;color:var(--soft);text-align:center;margin:16px 0 0}
.note-top a{color:var(--ink);font-weight:700;letter-spacing:.06em;text-decoration-color:var(--red);text-underline-offset:3px}

/* sections */
#menu{column-gap:56px}
@media (min-width:900px){ #menu{column-count:2} }
section.grp{break-inside:avoid-column;padding:24px 0 20px;border-bottom:1px solid var(--hair);scroll-margin-top:52px}
section.grp.long{break-inside:auto}
h2{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 20px;font-weight:500;font-size:16px;letter-spacing:.22em;text-transform:uppercase;text-align:center}
h2::before,h2::after{content:"";width:64px;height:7px;flex:none;background:
  radial-gradient(circle,var(--red) 0 2.2px,transparent 2.6px) right center/7px 7px no-repeat,
  linear-gradient(var(--hair),var(--hair)) left center/52px 1px no-repeat}
h2::after{transform:scaleX(-1)}
h3{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-weight:500;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);scroll-margin-top:52px}
h3::before,h3::after{content:"";flex:1;border-top:1px solid var(--hair)}

.body{display:grid;grid-template-columns:minmax(0,1fr);column-gap:16px;row-gap:16px}
.body.pr-right{grid-template-columns:minmax(0,1fr) 40%}
.body.pr-left{grid-template-columns:40% minmax(0,1fr)}
.body > *{grid-column:1/-1}
.body.pr-right > .beside{grid-column:1}
.body.pr-left > .beside{grid-column:2}
.photo{grid-row:1 / span 3;align-self:start;aspect-ratio:4/5;border-radius:16px;background:var(--slot);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;color:var(--soft)}
.body.pr-right > .photo{grid-column:2}
.body.pr-left > .photo{grid-column:1}
.photo::before{content:"";position:absolute;inset:7px;border:1px dashed var(--hair);border-radius:11px}
.photo.banner{grid-row:auto;grid-column:1/-1;aspect-ratio:16/7}
.photo svg{width:30px;height:30px;opacity:.7}
.photo b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.photo span{font-size:11px}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;break-inside:avoid}
.nm{margin:0;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
.loc{font-weight:500;font-size:13.5px;margin-top:1px}
.ds{margin:2px 0 0;font-size:12.5px;color:var(--soft);line-height:1.45}
.op{list-style:none;margin:3px 0 0;padding:0;font-size:12px;color:var(--soft)}
.op li::before{content:"+ ";color:var(--red);font-weight:700}
.txt{grid-column:1;min-width:0}
.pr{grid-column:2;grid-row:1;text-align:right;font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column;gap:1px;padding-top:0}
.pr small{font-size:11px;color:var(--soft);margin-right:5px;font-weight:400}
.pr.multi span{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;margin-bottom:3px}
.pr.multi small{margin-right:0}

.setline{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;margin:-6px 0 4px;font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.setline span{white-space:nowrap}
.setline em{font-style:normal;font-weight:500;margin-left:8px}
.extras{border-top:1px solid var(--hair);padding-top:12px}
.extras h4{margin:0 0 8px;font-weight:500;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.extras div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:2px 0;font-variant-numeric:tabular-nums}
.extras div span:first-child{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
blockquote{margin:2px 0;text-align:center;font-family:var(--script);font-size:24px;line-height:1.25;color:#8A6E4B}
:lang(zh) blockquote,:lang(ja) blockquote{font-family:var(--sans);font-size:14px;letter-spacing:.08em}
.notice{border:1px solid var(--hair);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--soft);text-align:center}

footer{padding:22px 0 40px;font-size:12px;color:var(--soft);text-align:center}
footer .notice{color:var(--ink);font-size:13px;margin-bottom:14px}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;align-items:center}
.draft{border:1px dashed var(--hair);border-radius:999px;padding:2px 10px}
.revbtn{border:1px solid var(--hair);border-radius:999px;background:transparent;color:var(--ink);font:inherit;padding:5px 12px;cursor:pointer}
.flag{display:none;grid-column:1/-1;margin-top:6px;font-size:12px;line-height:1.4;background:var(--flag);border:1px dashed #B59A2B;color:#3D3200;padding:5px 9px;border-radius:8px;text-align:left}
.flag b{margin-right:4px}
body.review .flag{display:block}
.revsum{display:none;margin:14px 0 0;padding:10px 12px;background:var(--flag);border:1px dashed #B59A2B;border-radius:10px;color:#3D3200;font-size:13px;text-align:left}
body.review .revsum{display:block}

.sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(36,33,30,.35)}
.sheet.open{display:flex}
.panel{background:var(--paper);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 18px 24px;max-height:80%;overflow:auto}
.panel h5{margin:4px 0 8px;font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--soft)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;font-size:16px;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--hair);padding:13px 2px;cursor:pointer;min-height:48px}
.opt[aria-checked="true"]{font-weight:700}
.opt[aria-checked="true"]::after{content:"✓";color:var(--red)}
@media (max-width:360px){ .body.pr-right,.body.pr-left{grid-template-columns:minmax(0,1fr)} .photo{display:none} }
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }
</style>
</head>

    if(x.kind==='slogan') return el('blockquote',null,esc(String(t.d).replace(/\b([A-ZÄÖÜ]{3,})\b/g,function(w){ return w.charAt(0)+w.slice(1).toLowerCase(); })));
    if(x.kind==='notice'){ var n=el('div','notice',esc(t.d)+flagHTML(x.id)); n.id='it-'+x.id; return n; }
    if(x.kind==='setline'){ var w=el('div','setline'); w.id='it-'+x.id; w.innerHTML=t.p.map(function(q){ return '<span>'+esc(q[0])+'<em>'+esc(q[1])+'</em></span>'; }).join(''); return w; }
    if(x.kind==='extras'){ var e=el('div','extras'); e.id='it-'+x.id; var h='<h4>'+esc(t.n)+'</h4>'; t.p.forEach(function(q){ h+='<div><span>'+esc(q[0])+'</span><span>'+esc(q[1])+'</span></div>'; }); e.innerHTML=h+flagHTML(x.id); return e; }
    var d=el('article','item'); d.id='it-'+x.id;
    var title=x.alb||t.n, html='<div class="txt"><h4 class="nm">'+esc(title)+'</h4>';
    if(x.alb && t.n) html+='<div class="loc">'+esc(t.n)+'</div>';
    if(t.d) html+='<p class="ds">'+esc(t.d)+'</p>';
    var pls=(t.p||[]).map(function(q){return q[0];});
    var oo=(t.o||[]).filter(function(o){ return pls.indexOf(o)<0; });
    if(oo.length) html+='<ul class="op">'+oo.map(function(o){ return '<li>'+esc(o)+'</li>'; }).join('')+'</ul>';
    html+='</div>';
    if(t.p && t.p.length) html+='<div class="pr'+(t.p.length>1?' multi':'')+'">'+t.p.map(function(q){ return '<span>'+(q[0]?'<small>'+esc(q[0])+'</small>':'')+esc(q[1])+'</span>'; }).join('')+'</div>';
    d.innerHTML=html+flagHTML(x.id);
    return d;
  }
  function photoSlot(sid){
    var x=byId[PHOTO[sid]]; var ui=UI[lang];
    return el('div','photo','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.6"/><path d="M8 6l1.6-2h4.8L16 6"/></svg><b>'+esc(x.alb)+'</b><span>'+esc(ui.photo)+'</span>');
  }

  function render(){
    document.documentElement.lang=lang;
    var ui=UI[lang], S=D.texts[lang].sec;
    document.getElementById('tag').textContent=ui.tag;
    document.getElementById('langname').textContent=LANGS.filter(function(l){return l[0]===lang;})[0][1];
    document.getElementById('sheettitle').textContent=ui.pick;
    var top=document.getElementById('top'); top.innerHTML='';
    if(byId.N00) top.appendChild(el('p','note-top',esc(T('N00').d)+' &nbsp;·&nbsp; <a href="#" id="allink">'+esc(ui.al)+'</a>'));
    var qn={}; Object.keys(REV).forEach(function(k){ REV[k].forEach(function(q){ qn[q[0]]=1; }); });
    top.appendChild(el('div','revsum','<b>审校模式</b>：'+Object.keys(qn).length+' 个问题待餐厅确认，涉及 '+Object.keys(REV).length+' 个条目，已用黄色标出。正式上线前关闭本模式。照片位置为占位，等餐厅提供菜品照片。'));
    var menu=document.getElementById('menu'); menu.innerHTML='';
    var chips=document.getElementById('chips'); chips.innerHTML='';
    var photoCount=0;
    groups.forEach(function(g){
      var sec=el('section','grp'+(LONG[g.id]?' long':'')); sec.id='sec-'+g.id;
      sec.appendChild(el('h2',null,esc(S[g.id])));
      var body=el('div','body'); sec.appendChild(body);
      var own=(bySec[g.id]||[]).filter(function(x){ return x.id!=='N02'; });
      var firstFood=own.filter(function(x){ return x.kind==='food'; }).slice(0,3);
      var sideOK=PHOTO[g.id] && firstFood.length===3 && firstFood.every(function(x){ return (x.prices||[]).length<=1; });
      if(PHOTO[g.id] && !sideOK){
        body.appendChild(photoSlot(g.id)).classList.add('banner');
        own.forEach(function(x){ body.appendChild(renderItem(x)); });
      } else if(PHOTO[g.id]){
        body.className='body '+(photoCount%2?'pr-left':'pr-right'); photoCount++;
        var n=0;
        own.forEach(function(x){ var e=renderItem(x); if(x.kind==='food' && n<3){ e.classList.add('beside'); n++; } else if(x.kind==='setline'){ } body.appendChild(e); });
        var ph=photoSlot(g.id);
        var firstBeside=body.querySelector('.beside');
        body.insertBefore(ph, firstBeside||body.firstChild);
        if(firstBeside){ var idx=Array.prototype.indexOf.call(body.children, firstBeside); ph.style.gridRow=(idx)+' / span 3'; }
      } else {
        own.forEach(function(x){ body.appendChild(renderItem(x)); });
      }
      (children[g.id]||[]).forEach(function(c){
        var h=el('h3',null,esc(S[c.id])); h.id='sec-'+c.id; body.appendChild(h);
        (bySec[c.id]||[]).forEach(function(x){ if(x.id!=='N02') body.appendChild(renderItem(x)); });
      });
      menu.appendChild(sec);
      var b=el('button','chip',esc(S[g.id])); b.type='button'; b.dataset.target='sec-'+g.id;
      b.addEventListener('click',function(){ document.getElementById(this.dataset.target).scrollIntoView(); });
      chips.appendChild(b);
    });
    var foot=document.getElementById('foot'); foot.innerHTML='';
    if(byId.N02){ var an=el('div','notice',esc(T('N02').d)); an.id='allergen'; foot.appendChild(an); }
    var m=el('div','meta');
    m.appendChild(el('span',null,'Kolonja · '+esc(ui.city)));
    m.appendChild(el('span','draft',esc(ui.draft)));
    m.appendChild(el('span',null,esc(VERSION)));
    var rb=el('button','revbtn',document.body.classList.contains('review')?'关闭审校模式':'审校模式（显示待确认项）'); rb.type='button';
    rb.addEventListener('click',function(){ document.body.classList.toggle('review'); render(); });
    if(/review/.test(location.search) || /claude\.ai$|^$/.test(location.hostname)) m.appendChild(rb);
    foot.appendChild(m);
    var al=document.getElementById('allink'); if(al) al.addEventListener('click',function(ev){ ev.preventDefault(); document.getElementById('allergen').scrollIntoView(); });
    var list=document.getElementById('langlist'); list.innerHTML='';
    LANGS.forEach(function(l){ var o=el('button','opt',esc(l[1])); o.type='button'; o.setAttribute('role','radio'); o.setAttribute('lang',l[0]); o.setAttribute('aria-checked',l[0]===lang?'true':'false'); o.addEventListener('click',function(){ setLang(l[0]); }); list.appendChild(o); });
    spy();
  }
  function anchorNow(){ var nodes=document.querySelectorAll('#menu [id^="it-"], #menu h3[id], #menu section[id]'); for(var i=0;i<nodes.length;i++){ var r=nodes[i].getBoundingClientRect(); if(r.bottom>60 && r.top>=0) return nodes[i].id; } return null; }
  function setLang(l){ var keep=anchorNow(); lang=l; try{ history.replaceState(null,'','#'+l); }catch(e){ location.hash=l; } closeSheet(); render(); if(keep){ var n=document.getElementById(keep); if(n){ window.scrollTo({top:n.getBoundingClientRect().top+window.scrollY-58,behavior:'auto'}); } } }
  var sheet=document.getElementById('sheet');
  function openSheet(){ sheet.classList.add('open'); var c=sheet.querySelector('[aria-checked="true"]'); if(c) c.focus(); }
  function closeSheet(){ sheet.classList.remove('open'); }
  document.getElementById('langbtn').addEventListener('click',openSheet);
  sheet.addEventListener('click',function(e){ if(e.target===sheet) closeSheet(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });
  window.addEventListener('hashchange',function(){ var h=location.hash.replace('#',''); if(D.texts[h]&&h!==lang) setLang(h); });
  var ticking=false;
  function spy(){ var secs=document.querySelectorAll('#menu section.grp'), cur=null, best=-1e9; for(var i=0;i<secs.length;i++){ var t=secs[i].getBoundingClientRect().top; if(t<80 && t>best){ best=t; cur=secs[i].id; } } if(!cur&&secs.length) cur=secs[0].id; document.querySelectorAll('.chip').forEach(function(c){ var on=c.dataset.target===cur; if(on&&c.getAttribute('aria-current')!=='true'){ c.setAttribute('aria-current','true'); c.parentNode.scrollLeft=c.offsetLeft-18; } if(!on) c.removeAttribute('aria-current'); }); }
  window.addEventListener('scroll',function(){ if(!ticking){ ticking=true; requestAnimationFrame(function(){ spy(); ticking=false; }); } },{passive:true});
  render();
})();
</script>
</body>
</html>
